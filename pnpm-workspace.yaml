allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@reown/appkit": false
  "@sentry/cli": false
  "bigint-buffer": false
  "bufferutil": false
  "core-js": false
  "esbuild": false
  "keccak": false
  "lefthook": true
  msw: false
  "prisma": false
  "protobufjs": false
  "secp256k1": false
  "sharp": false
  "tiny-secp256k1": false
  "utf-8-validate": false
blockExoticSubdeps: false
strictDepBuilds: true
minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - "@voidzero-dev/*"
  - vite-plus
  - "@vitest/*"
  - vite
  - vitest
  - "@oxc-project/*"
  - "@oxlint/*"
  - oxlint
  - oxfmt
  - oxlint-tsgolint
packages:
  - apps/*
  - packages/*
