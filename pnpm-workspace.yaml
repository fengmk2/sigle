allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@reown/appkit": false
  "@sentry/cli": false
  "bigint-buffer": false
  "bufferutil": false
  "core-js": false
  "esbuild": false
  "keccak": false
  "lefthook": true
  msw: false
  "prisma": false
  "protobufjs": false
  "secp256k1": false
  "sharp": false
  "tiny-secp256k1": false
  "utf-8-validate": false
blockExoticSubdeps: false
strictDepBuilds: true
minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - "@oxlint/*"
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - vitest
  - "@vitest/*"
overrides:
  "@voidzero-dev/vite-plus-core": "https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-core@5577b0154f33d1480a3c96347e94fa5d2094de2e"
  "@voidzero-dev/vite-plus-prompts": "https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-prompts@5577b0154f33d1480a3c96347e94fa5d2094de2e"
packages:
  - apps/*
  - packages/*
